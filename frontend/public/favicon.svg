<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="eye-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Canvas -->
  <rect width="64" height="64" rx="18" fill="url(#favicon-grad)" />

  <!-- Outer Ring Highlight -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Antenna -->
  <path d="M32 12V19" stroke="white" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="11" r="3.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- AI Robot Head Body -->
  <rect x="15" y="20" width="34" height="27" rx="8" fill="#0f172a" stroke="white" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Visor Screen -->
  <rect x="19" y="24" width="26" height="13" rx="5" fill="#1e293b" />

  <!-- Glowing Eyes -->
  <circle cx="26.5" cy="30.5" r="3.5" fill="url(#eye-grad)" filter="url(#glow)" />
  <circle cx="37.5" cy="30.5" r="3.5" fill="url(#eye-grad)" filter="url(#glow)" />
  
  <!-- Eye Reflections -->
  <circle cx="28" cy="29" r="1" fill="white" />
  <circle cx="39" cy="29" r="1" fill="white" />

  <!-- Smile / Audio Wave Bars -->
  <rect x="24" y="40" width="3" height="3" rx="1.5" fill="#38bdf8" />
  <rect x="29" y="39.5" width="6" height="4" rx="2" fill="#818cf8" />
  <rect x="37" y="40" width="3" height="3" rx="1.5" fill="#38bdf8" />
</svg>
